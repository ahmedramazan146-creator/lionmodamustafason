<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000/api' 
            : 'https://lionmoda.onrender.com/api';
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ليون موضة | تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff6a00, #ff2d75, #8b5cf6, #3b82f6);
            background-size: 400% 400%;
            animation: gradientShift 10s ease-in-out infinite;
            margin: 0;
            padding: 20px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .auth-page-solo {
            width: 100%;
            max-width: 440px;
        }
        .auth-box-solo {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-header h2 {
            font-size: 28px;
            color: var(--dark);
            margin-bottom: 4px;
        }
        .auth-header p {
            color: var(--gray);
            font-size: 14px;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-group i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 16px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 42px 14px 18px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            color: var(--dark);
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition);
        }
        .input-group input:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.04);
        }
        .btn-auth {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6a00, #ff2d75);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 106, 0, 0.3);
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--gray);
            font-size: 14px;
        }
        .auth-footer a {
            color: var(--secondary);
            font-weight: 700;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 18px 0;
            color: var(--gray);
            font-size: 13px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .back-home {
            display: inline-block;
            margin-top: 12px;
            color: var(--gray);
            text-decoration: none;
            font-size: 13px;
            transition: var(--transition);
        }
        .back-home:hover {
            color: var(--secondary);
        }
        #loginError {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .logo-center {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-center .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6a00, #ff2d75);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-center .logo span {
            color: var(--dark);
            -webkit-text-fill-color: var(--dark);
        }
        .logo-center .logo .logo-icon {
            -webkit-text-fill-color: #ff6a00;
        }
    </style>
</head>
<body>

    <div class="auth-page-solo">
        <div class="auth-box-solo">
            
            <div class="logo-center">
                <div class="logo">
                    <span class="logo-icon">◆</span>
                    ليون <span>موضة</span>
                </div>
            </div>

            <div class="auth-header">
                <h2>مرحباً بعودتك 👋</h2>
                <p>سجل الدخول إلى حسابك</p>
            </div>

            <form id="loginForm" onsubmit="handleLoginPage(event)">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="loginEmail" placeholder="البريد الإلكتروني" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="كلمة السر" required />
                </div>
                
                <div id="loginError"></div>
                
                <button type="submit" class="btn-auth">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>

            <div class="auth-divider">أو</div>

            <div class="auth-footer">
                ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
            </div>

            <div style="text-align:center; margin-top:12px;">
                <a href="index.html" class="back-home">
                    <i class="fas fa-arrow-right"></i> العودة للرئيسية
                </a>
            </div>

            <div style="text-align:center; margin-top:16px; color:var(--gray); font-size:12px;">
                ✧  KBS  ✧
            </div>
        </div>
    </div>

    <script>
        function handleLoginPage(e) {
            e.preventDefault();
            
            const identifier = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            errorDiv.style.display = 'none';

            if (!identifier || !password) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '⚠️ يرجى ملء جميع الحقول';
                return;
            }

            axios.post(API_URL + '/auth/login', { 
                email: identifier, 
                password: password 
            })
            .then(response => {
                const data = response.data;
                localStorage.setItem('kbs_token', data.token);
                localStorage.setItem('kbs_user', JSON.stringify(data.user));
                window.location.href = 'index.html';
            })
            .catch(err => {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '⚠️ ' + (err.response?.data?.error || 'فشل تسجيل الدخول');
            });
        }
    </script>

</body>
</html>
